services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nova_demo
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  memcached:
    image: memcached:1.6-alpine
    ports:
      - "127.0.0.1:51211:11211"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\nquit\\r\\n' | nc -w 1 127.0.0.1 11211 | grep -q VERSION"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:

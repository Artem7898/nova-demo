name: Demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    env:
      UV_PYTHON: "3.12"
      NOVA_DEMO_DB: ${{ matrix.database }}
      PGPORT: "5433"
      NOVA_DEMO_REDIS_URL: redis://127.0.0.1:56379/0
      NOVA_DEMO_MEMCACHED_SERVER: 127.0.0.1:51211
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras --dev
      - run: docker compose up -d --wait
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: uv run --locked pyright catalog config
      - run: node --check static/demo/app.js
      - run: uv run --locked manage.py check
      - run: uv run --locked manage.py makemigrations --check --dry-run
      - run: uv run --locked manage.py migrate --noinput
      - run: uv run --locked manage.py collectstatic --noinput
      - run: uv run --locked manage.py spectacular --validate --file /tmp/nova-demo-api.yaml
      - run: uv run --locked pytest -q -rs -W error::pytest.PytestWarning
      - run: uv run --locked manage.py nova_smoke --require-services
      - if: always()
        run: docker compose down
  deployment:
    name: Railway container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t nova-demo:railway .
      - name: Start with a persistent volume
        run: |
          docker volume create nova-demo-deploy
          docker run -d --name nova-demo-deploy -p 127.0.0.1:58000:8000 \
            -v nova-demo-deploy:/data \
            -e RAILWAY_ENVIRONMENT_ID=ci \
            -e RAILWAY_VOLUME_MOUNT_PATH=/data \
            -e RAILWAY_PUBLIC_DOMAIN=demo.example \
            -e DJANGO_SECRET_KEY=ci-only-not-a-production-secret-railway-deployment-test \
            -e PORT=8000 nova-demo:railway
      - name: Check production HTTP and languages
        run: python deploy/check_http.py http://127.0.0.1:58000
      - name: Run demo scenarios without optional services
        run: docker exec nova-demo-deploy python manage.py nova_smoke
      - if: always()
        name: Container logs and cleanup
        run: |
          docker logs nova-demo-deploy || true
          docker rm -f nova-demo-deploy || true
          docker volume rm nova-demo-deploy || true

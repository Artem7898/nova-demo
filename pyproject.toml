[project]
name = "nova-demo"
version = "0.2.1"
description = "Interactive dogfooding lab for Django Nova 0.6.3"
requires-python = ">=3.12,<3.15"
dependencies = [
 "django>=5.2.17,<5.3", "django-nova==0.6.3", "djangorestframework>=3.18.1,<4",
 "drf-spectacular>=0.30.0,<1", "pillow>=12.3.0,<13", "psycopg[binary]>=3.3.5,<4",
 "redis>=5,<8", "pymemcache>=4,<5", "opentelemetry-sdk>=1.30,<2",
 "whitenoise>=6.8,<7", "gunicorn>=23,<24",
]
[project.optional-dependencies]
adapters = ["fastapi>=0.115,<1", "strawberry-graphql>=0.270,<1", "httpx>=0.28,<1"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.15,<1",
    "pyright>=1.1.413",
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<4",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["integration: requires real Redis or Memcached"]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["catalog/migrations", "dump_api.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
